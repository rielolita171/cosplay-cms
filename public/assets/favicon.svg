<svg id="favicon-mascot" viewBox="7 0 68 68" width="68" height="68" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cosplay CMS">
<!-- THE TAB ICON, redrawn on a padded square.

     WHY NOT THE INHERITED GEOMETRY
     The version copied from docs/assets/favicon.svg used viewBox="13 4 56 56",
     which frames the artwork with almost no margin. Rendered as a favicon that
     clips both ears at the top corners and shaves the hem off the bottom — at
     16px the result is an unrecognisable blob, which is worse than no icon.

     This viewBox is a 68x68 square centred on the artwork's own bounds with
     roughly 5 units of padding on every side, so the silhouette survives being
     scaled down to a 16px tab.

     The accent colours are the DARK-background set (#818CF8 ears, #FBBF24
     sparkle, #38BDF8 stitch), matching public/assets/mark.svg. The muted
     light-background values this file used to carry are too dim to read against
     a dark browser chrome. See the suffix note in assets/README.md.

     Solid shapes only, no strokes thinner than 2.5: sub-pixel strokes drop out
     entirely at favicon sizes, which would leave the stitch loop half-drawn. -->
<!-- Hoodie body -->
<path d="M22 48C22 36.9543 30.9543 28 42 28C53.0457 28 62 36.9543 62 48V50C62 52.2091 60.2091 54 58 54H26C23.7909 54 22 52.2091 22 50V48Z" fill="url(#fav_grad)"></path>
<!-- Cat ears -->
<path d="M22 36L15 18C14.2 16 16.5 14.2 18.2 15.5L28 23" fill="#818CF8"></path>
<path d="M62 36L69 18C69.8 16 67.5 14.2 65.8 15.5L56 23" fill="#818CF8"></path>
<!-- Inner ear -->
<path d="M20 31L16.2 20.2C15.8 19.1 17.1 18.2 18 18.9L24.8 24.3" fill="#EC4899"></path>
<path d="M64 31L67.8 20.2C68.2 19.1 66.9 18.2 66 18.9L59.2 24.3" fill="#EC4899"></path>
<!-- Hood opening -->
<path d="M27 46C27 37.7157 33.7157 31 42 31C50.2843 31 57 37.7157 57 46V54H27V46Z" fill="#FFF0F5"></path>
<!-- Eyes -->
<circle cx="36" cy="42" r="2.5" fill="#1E1B4B"></circle>
<circle cx="48" cy="42" r="2.5" fill="#1E1B4B"></circle>
<!-- Cheeks -->
<circle cx="33" cy="45" r="2" fill="#F472B6" opacity="0.6"></circle>
<circle cx="51" cy="45" r="2" fill="#F472B6" opacity="0.6"></circle>
<!-- W smile -->
<path d="M39 45C39.8 46.2 41 46.2 42 45C43 46.2 44.2 46.2 45 45" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"></path>
<!-- Sparkle -->
<path d="M42 12L44 17L49 19L44 21L42 26L40 21L35 19L40 17L42 12Z" fill="#FBBF24"></path>
<!-- Sewing stitch -->
<path d="M19 50C15 48 13 42 14 36" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"></path>
<circle cx="14" cy="35" r="2.5" fill="#38BDF8"></circle>
<defs>
<linearGradient id="fav_grad" x1="22" y1="28" x2="62" y2="54" gradientUnits="userSpaceOnUse">
<stop offset="0%" stop-color="#818CF8"></stop>
<stop offset="100%" stop-color="#6366F1"></stop>
</linearGradient>
</defs>
</svg>
